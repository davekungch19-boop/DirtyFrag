
name: SONTEEN Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ko-select-tests:
    name: Native selection logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run tests
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror \
            -I app/src/main/jni \
            tests/ko_select_test.c \
            -o /tmp/ko_select_test
          /tmp/ko_select_test

  build-apk:
    name: Build SONTEEN APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONTEEN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
